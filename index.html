<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collin College | Virtual Career Center</title><style>
*{box-sizing:border-box}body{margin:0;background:#111e3a;color:white;font-family:Arial,sans-serif}.scene{position:relative;width:100%;max-width:1875px;margin:auto}.scene img{display:block;width:100%;height:auto}.hotspots{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.station{fill:transparent;stroke:#ffd72b;stroke-width:4;stroke-opacity:0;cursor:pointer;vector-effect:non-scaling-stroke;transition:stroke-opacity .16s}.station:hover,.station:focus{stroke-opacity:1;outline:none}.station:focus-visible{stroke:#fff;stroke-opacity:1;stroke-width:6}.footer{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;width:max-content;max-width:calc(100% - 24px);padding:12px 20px;text-align:center;font-size:14px;line-height:1.4;background:#111e3aeb;border:1px solid #ffffff35;border-radius:12px;box-shadow:0 5px 20px #0005}.footer a{color:#fff;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}.footer a:focus-visible{outline:2px solid #ffd72b;outline-offset:3px}@media(max-width:620px){.footer{bottom:10px;padding:10px 12px;gap:7px 12px;font-size:12px;width:calc(100% - 20px)}}.modal-backdrop{position:fixed;inset:0;background:#061129bb;display:none;align-items:center;justify-content:center;padding:20px;z-index:2}.modal-backdrop.open{display:flex}.modal{background:white;color:#132450;border-radius:14px;max-width:390px;width:100%;padding:24px;box-shadow:0 12px 40px #0006}.modal h2{margin:0 0 14px;font-size:21px}.modal a{display:block;background:#173c85;color:white;padding:12px;border-radius:8px;margin:10px 0;text-align:center;text-decoration:none;font-weight:700}.modal button{background:transparent;border:1px solid #aaa;border-radius:7px;padding:9px 16px;cursor:pointer;width:100%;margin-top:5px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body><main><div class="scene"><img src="room.png" alt="Collin College Virtual Career Center with eight interactive computer stations" width="1875" height="839"><svg class="hotspots" viewBox="0 0 1875 839" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Career tools: select a computer monitor">
<a href="https://pathfinder123-creator.github.io/career-interest-assessment/" target="_blank" rel="noopener noreferrer" aria-label="Open Career Interest Assessment"><rect class="station" tabindex="0" x="69" y="421" width="168" height="107" rx="1"/></a>
<a href="https://pathfinder123-creator.github.io/job-matchup/" target="_blank" rel="noopener noreferrer" aria-label="Open Job Matchup"><rect class="station" tabindex="0" x="300" y="421" width="161" height="107" rx="1"/></a>
<a href="https://pathfinder123-creator.github.io/elevator-pitch/" target="_blank" rel="noopener noreferrer" aria-label="Open Build Your Pitch"><rect class="station" tabindex="0" x="519" y="421" width="158" height="107" rx="1"/></a>
<rect class="station" tabindex="0" role="button" aria-label="Choose Résumé Builder or Cover Letter Builder" x="737" y="421" width="159" height="107" rx="1" onclick="openChoices()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChoices()}"/>
<a href="https://pathfinder123-creator.github.io/internship-connector/" target="_blank" rel="noopener noreferrer" aria-label="Open Internship Connector"><rect class="station" tabindex="0" x="955" y="421" width="165" height="107" rx="1"/></a>
<a href="https://pathfinder123-creator.github.io/opportunity-springboard/" target="_blank" rel="noopener noreferrer" aria-label="Open Opportunity Springboard"><rect class="station" tabindex="0" x="1182" y="421" width="164" height="107" rx="1"/></a>
<a href="https://pathfinder123-creator.github.io/interview-gym/" target="_blank" rel="noopener noreferrer" aria-label="Open Interview Gym"><rect class="station" tabindex="0" x="1408" y="421" width="165" height="107" rx="1"/></a>
<a href="https://pathfinder123-creator.github.io/goal-getter/" target="_blank" rel="noopener noreferrer" aria-label="Open Goal-Getter Planner"><rect class="station" tabindex="0" x="1635" y="421" width="164" height="107" rx="1"/></a>
</svg></div><nav class="footer" aria-label="Career Center quick links"><span>Select a computer screen to launch its tool.</span><a href="#tools" onclick="event.preventDefault();openChoices('all')">All tools</a><a href="https://bookings.cloud.microsoft/book/CareerCenterManagers1@collin.edu/?ismsaljsauthenabled" target="_blank" rel="noopener noreferrer">Book an Appointment</a><a href="https://www.collin.edu/studentresources/career/" target="_blank" rel="noopener noreferrer">Career Center webpage</a></nav></main>
<div class="modal-backdrop" id="choices" onclick="if(event.target===this)closeChoices()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Résumé &amp; Cover Letter Builders</h2><div id="dialog-links"><a href="https://pathfinder123-creator.github.io/resume-builder/" target="_blank" rel="noopener noreferrer">Open Résumé Builder</a><a href="https://pathfinder123-creator.github.io/cover-letter-builder/" target="_blank" rel="noopener noreferrer">Open Cover Letter Builder</a></div><button onclick="closeChoices()">Close</button></div></div>
<script>const links=[['Career Interest Assessment','career-interest-assessment'],['Job Matchup','job-matchup'],['Build Your Pitch','elevator-pitch'],['Résumé Builder','resume-builder'],['Cover Letter Builder','cover-letter-builder'],['Internship Connector','internship-connector'],['Opportunity Springboard','opportunity-springboard'],['Interview Gym','interview-gym'],['Goal-Getter Planner','goal-getter']];function openChoices(mode){const all=mode==='all';document.getElementById('dialog-title').textContent=all?'All Career Tools':'Résumé & Cover Letter Builders';document.getElementById('dialog-links').innerHTML=(all?links:links.slice(3,5)).map(([name,path])=>`<a href="https://pathfinder123-creator.github.io/${path}/" target="_blank" rel="noopener noreferrer">${name}</a>`).join('');document.getElementById('choices').classList.add('open');document.querySelector('.modal button').focus()}function closeChoices(){document.getElementById('choices').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChoices()});</script></body></html>
